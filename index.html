function req(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}

function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}

async function reloadManifest(){manifest=(await all('manifest')).filter(x=>x.status==='ready').sort((a,b)=>a.date.localeCompare(b.date));$('#headDate').textContent=manifest.length?'Dữ liệu mới nhất: '+manifest.at(-1).date:'Chưa có dữ liệu';let options=manifest.map(x=>`<option value="${x.date}">${x.date}</option>`).join('');let old=$('#day').value;$('#day').innerHTML=options||'<option value="">Chưa có ngày</option>';$('#day').value=manifest.some(x=>x.date===old)?old:manifest.at(-1)?.date||'';let oldBase=$('#baseDay').value;$('#baseDay').innerHTML='<option value="">Chọn ngày gốc</option>'+options;$('#baseDay').value=manifest.some(x=>x.date===oldBase)?oldBase:'';await refreshData()}

function val(r,key){return num(r.v[K[r.kind][key]])}function sum(rows,key){let total=0,missing=0;for(let r of rows){let n=val(r,key);if(n===null)missing++;else total+=n}return {total,missing}}

function updateSortable(uid,query){let z=window.__tables?.[uid];if(!z)return;z.query=query??z.query??'';let arr=z.rows.filter(row=>row.some(v=>String(v??'').toLocaleLowerCase('vi').includes(z.query.toLocaleLowerCase('vi'))));if(z.sort>=0)arr.sort((a,b)=>{let x=a[z.sort],y=b[z.sort],nx=typeof x==='number'?x:Number(String(x).replace(/,/g,'')),ny=typeof y==='number'?y:Number(String(y).replace(/,/g,''));let n=Number.isFinite(nx)&&Number.isFinite(ny)?nx-ny:String(x??'').localeCompare(String(y??''),'vi',{numeric:true});return z.desc?-n:n});z.filtered=arr;let el=document.getElementById(uid+'body');if(!el)return;el.innerHTML=`<div class="tablewrap"><table><thead><tr>${z.headers.map((h,i)=>`<th style="cursor:pointer" onclick="sortSortable('${uid}',${i})" title="Bấm để sắp xếp">${esc(h)} ${z.sort===i?(z.desc?'▼':'▲'):'↕'}</th>`).join('')}</tr></thead><tbody>${arr.slice(0,z.limit).map(row=>`<tr>${row.map(v=>`<td class="${typeof v==='number'?'num':''}">${typeof v==='number'?money(v):esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${arr.length>z.limit?`<p class="muted">Hiển thị ${z.limit}/${arr.length} dòng; CSV xuất đầy đủ danh sách đã lọc.</p>`:''}`;document.getElementById(uid+'count').textContent=arr.length+' / '+z.rows.length+' dòng';}

function bars(items){if(!items.length)return '<p class="muted">Chưa có dữ liệu.</p>';let max=Math.max(...items.map(x=>Math.abs(x.balance)),1);return items.slice(0,10).map(x=>`<div style="display:grid;grid-template-columns:minmax(80px,180px) 1fr 130px;gap:8px;align-items:center;margin:10px 0"><span title="${esc(x.name)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.name)}</span><div class="bar"><div style="width:${Math.max(0,Math.abs(x.balance)/max*100)}%"></div></div><span style="text-align:right">${money(x.balance)}</span></div>`).join('')}
function kpiCards(rows,previous,kind){let curr=sum(rows,'balance'),prev=sum(previous,'balance');let change=previous.length?curr.total-prev.total:null;return `<div class="grid">${stat('Số dư quy đổi',money(curr.total),curr.missing?curr.missing+' dòng thiếu số dư':'')}${stat('Chênh lệch kỳ gốc',change===null?'N/A':money(change),previous.length?'Đã có kỳ so sánh':'Chưa có kỳ gốc')}${stat('Khách hàng duy nhất',fmt(distinct(rows,'client')))}${stat('Số tài khoản',fmt(distinct(rows,'account')))}</div>`}
function detailed(kind){let r=filterRows(active,kind),p=filterRows(base,kind),k=K[kind];let rate=weighted(r,'rate'),ftp=weighted(r,'ftp'),nim=weighted(r,'nim');let metrics=`<div class="grid" style="margin-top:12px">${stat('Lãi suất INCAS BQ',rate.value===null?'N/A':fmt(rate.value,4))}${stat('Lãi suất FTP BQ',ftp.value===null?'N/A':fmt(ftp.value,4))}${stat('NIM BQ',nim.value===null?'N/A':fmt(nim.value,4))}${stat(kind==='DP'?'NII ngày':'Thu nhập ròng ngày',money(sum(r,'daily').total))}</div>`;let grp=groupSum(r,x=>dims(x).deptname||dims(x).dept||'Không xác định');let body=kpiCards(r,p,kind)+metrics+`<div class="two" style="margin-top:16px">${panel('Số dư theo phòng ban',bars(grp))}${panel('Số dư theo phân khúc',bars(groupSum(r,x=>dims(x).segment||'Không xác định')))}</div>`;if(kind==='LN'){let g=groupSum(r,x=>id(x.v[k.group])||'Không rõ'),npl=r.filter(x=>['3','4','5'].includes(id(x.v[k.group]))),tot=sum(r,'balance').total,ng=sum(npl,'balance').total;body+=panel('Chất lượng tín dụng',`<div class="grid">${stat('Nợ xấu nhóm 3–5',money(ng))}${stat('Tỷ lệ nợ xấu',tot>0?fmt(ng/tot*100,2)+'%':'N/A')}${stat('Nợ nhóm 2',money(sum(r.filter(x=>id(x.v[k.group])==='2'),'balance').total))}${stat('Nhóm nợ không hợp lệ',fmt(r.filter(x=>!['1','2','3','4','5'].includes(id(x.v[k.group]))).length))}</div>${table(['Nhóm nợ','Số dòng','Dư nợ'],g.map(x=>[x.name,String(x.count),x.balance]))}`)}else{body+=panel('Thu nhập FTP / NII',`<div class="grid">${stat('FTP ngày',money(sum(r,'ftpdaily').total))}${stat('FTP cộng dồn tại ngày',money(sum(r,'ftpcum').total))}${stat('NII ngày',money(sum(r,'daily').total))}${stat('NII cộng dồn tại ngày',money(sum(r,'cumulative').total))}</div>`)}return body+panel('Chi tiết tài khoản (100 dòng đầu)',table(['Mã phòng','Mã cán bộ','Số CIF','Tên khách hàng','Số tài khoản','Số dư quy đổi'],r.map(x=>[id(x.v[k.department]),id(x.v[k.staff]),id(x.v[k.client]),customerName(x)||'Chưa có tên',id(x.v[k.account]),val(x,'balance')]),100))}
function officerReportRows(){
 if($('#dept').value==='ALL'||$('#officer').value!=='ALL')return [];
 const groups=new Map();
 for(const r of filterRows(active)){
  const d=dims(r),code=d.officer||'Chưa có mã',key=code;
  if(!groups.has(key))groups.set(key,{code,name:'',dp:0,ln:0,dpCount:0,lnCount:0});
  const g=groups.get(key),amount=val(r,'balance');
  if(r.kind==='DP'){g.dpCount++;if(amount!==null)g.dp+=amount}
  else{g.lnCount++;if(amount!==null)g.ln+=amount;const n=String(r.v[K.LN.staffname]??'').trim();if(n)g.name=n}
 }
 return [...groups.values()].sort((a,b)=>a.code.localeCompare(b.code,'vi',{numeric:true}));
}
function officerCharts(){
 const dp=filterRows(active,'DP'),ln=filterRows(active,'LN');
 function byStaff(rows){const m=new Map();for(const r of rows){const d=dims(r),code=d.officer||'Chưa có mã',name=r.kind==='LN'?String(r.v[K.LN.staffname]??'').trim():'';if(!m.has(code))m.set(code,{code,name:'',balance:0,count:0});const x=m.get(code);if(name)x.name=name;const v=val(r,'balance');if(v!==null)x.balance+=v;x.count++}return [...m.values()].sort((a,b)=>b.balance-a.balance)}
 function graph(items){if(!items.length)return '<p class="muted">Chưa có dữ liệu cán bộ.</p>';const max=Math.max(1,...items.map(x=>Math.abs(x.balance)));return '<div style="max-height:440px;overflow:auto">'+items.map(x=>`<div style="display:grid;grid-template-columns:minmax(95px,175px) minmax(70px,1fr) minmax(95px,130px);gap:8px;align-items:center;margin:9px 0"><span title="${esc(x.code+' '+x.name)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.name?x.code+' — '+x.name:x.code)}</span><div class="bar"><div style="width:${Math.abs(x.balance)/max*100}%"></div></div><span style="text-align:right">${money(x.balance)}</span></div>`).join('')+'</div>'}
 return '<div class="two" style="margin-top:16px">'+panel('BIỂU ĐỒ TIỀN GỬI THEO CÁN BỘ',graph(byStaff(dp)))+panel('BIỂU ĐỒ DƯ NỢ THEO CÁN BỘ',graph(byStaff(ln)))+'</div><p class="tip">Hai biểu đồ sử dụng thang đo riêng; không cộng tiền gửi với dư nợ. Sắp xếp giảm dần theo số dư và tuân theo bộ lọc phòng ban, cán bộ hiện tại.</p>';
}
function officerReportPanel(){
 const a=officerReportRows();if($('#dept').value==='ALL'||$('#officer').value!=='ALL')return '';
 const body=a.length?table(['Mã cán bộ','Tên cán bộ','Số TK tiền gửi','Số dư tiền gửi','Số TK vay','Dư nợ'],a.map(x=>[x.code,x.name||'Chưa có tên',String(x.dpCount),money(x.dp),String(x.lnCount),money(x.ln)]),10000):'<p>Không có cán bộ thuộc phạm vi đã chọn.</p>';
 return panel('DANH SÁCH CÁN BỘ THUỘC PHÒNG — '+a.length+' cán bộ',body+'<p class="tip">Số dư tiền gửi và dư nợ được trình bày riêng, không cộng gộp. Tên cán bộ lấy từ AccountLN nếu có.</p>');
}
function overview(){let dp=filterRows(active,'DP'),ln=filterRows(active,'LN'),pdp=filterRows(base,'DP'),pln=filterRows(base,'LN');return `<div class="grid">${stat('Tiền gửi quy đổi',dashboardMoney(sum(dp,'balance').total),dp.length+' dòng')}${stat('Dư nợ quy đổi',dashboardMoney(sum(ln,'balance').total),ln.length+' dòng')}${stat('Biến động tiền gửi',pdp.length?dashboardMoney(sum(dp,'balance').total-sum(pdp,'balance').total):'N/A')}${stat('Biến động dư nợ',pln.length?dashboardMoney(sum(ln,'balance').total-sum(pln,'balance').total):'N/A')}</div><div class="grid" style="margin-top:12px">${stat('Khách hàng tiền gửi',fmt(distinct(dp,'client')))}${stat('Khách hàng vay',fmt(distinct(ln,'client')))}${stat('NII tiền gửi ngày',dashboardMoney(sum(dp,'daily').total))}${stat('Thu nhập ròng vay ngày',dashboardMoney(sum(ln,'daily').total))}</div>${$('#dept').value==='ALL'?`<div class="two" style="margin-top:16px">${panel('Tiền gửi theo phòng ban',bars(groupSum(dp,x=>dims(x).deptname||dims(x).dept||'Không xác định')))}${panel('Dư nợ theo phòng ban',bars(groupSum(ln,x=>dims(x).deptname||dims(x).dept||'Không xác định')))}</div>`:''}${officerCharts()}${officerReportPanel()}${panel('Cảnh báo chất lượng dữ liệu',`<p>Số dòng không có số dư hợp lệ: DP <b>${sum(dp,'balance').missing}</b>, LN <b>${sum(ln,'balance').missing}</b>. Dữ liệu tài chính hiển thị là tổng các dòng hợp lệ; cần đối soát khi có dòng thiếu.</p>`)}`}
function accountKey(r){return [r.kind,id(r.v[K[r.kind].branch]),id(r.v[K[r.kind].account])].join('|')}
function changeData(){let cur=filterRows(active),old=filterRows(base),a=new Map(),b=new Map(),dups=0;for(let r of cur){let k=accountKey(r);if(a.has(k))dups++;else a.set(k,r)}for(let r of old){let k=accountKey(r);if(b.has(k))dups++;else b.set(k,r)}let stats={new:0,up:0,down:0,gone:0,unchanged:0,transfer:0},items=[];for(let [k,r] of a){let now=val(r,'balance')||0,pr=b.get(k),prior=pr?(val(pr,'balance')||0):0,delta=now-prior,group=!pr?'new':delta>0?'up':delta<0?'down':'unchanged';stats[group]+=delta;if(pr&&(dims(pr).dept!==dims(r).dept||dims(pr).officer!==dims(r).officer))stats.transfer++;items.push({key:k,group,delta,dept:dims(r).dept,staff:dims(r).officer})}for(let [k,r] of b)if(!a.has(k)){let delta=-(val(r,'balance')||0);stats.gone+=delta;items.push({key:k,group:'gone',delta,dept:dims(r).dept,staff:dims(r).officer})}let total=sum(cur,'balance').total-sum(old,'balance').total,recon=stats.new+stats.up+stats.down+stats.gone;return `<div class="grid">${stat('Tài khoản mới',money(stats.new))}${stat('Tăng số dư',money(stats.up))}${stat('Giảm số dư',money(stats.down))}${stat('Không còn xuất hiện',money(stats.gone))}</div><div class="grid" style="margin-top:12px">${stat('Biến động ròng',money(total))}${stat('Chênh lệch phân rã',money(total-recon))}${stat('Chuyển cán bộ/phòng',fmt(stats.transfer)+' tài khoản')}${stat('Khóa tài khoản trùng',fmt(dups))}</div>${panel('Các biến động lớn nhất',table(['Tài khoản định danh','Nhóm biến động','Chênh lệch','Phòng','Cán bộ'],items.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)).map(x=>[x.key,x.group,x.delta,x.dept,x.staff]),150))}<p class="tip">Chuyển danh mục là thông tin riêng, không tự xem là tăng trưởng thực. Tài khoản biến mất không mặc nhiên là đã tất toán. Nếu khóa trùng hoặc số dư thiếu, phân rã chưa đủ điều kiện nghiệm thu.</p>${debtGroupChangePanel()}`}
// Danh sách biến động nhóm nợ: đối chiếu cùng khóa khoản vay giữa hai kỳ.
function debtGroupChanges(){
 const current=new Map(),previous=new Map();
 for(const r of active)if(r.kind==='LN')current.set(accountKey(r),r);
 for(const r of base)if(r.kind==='LN')previous.set(accountKey(r),r);
 const results=[];
 for(const [key,r] of current){
  const prior=previous.get(key);if(!prior)continue;
  const k=K.LN,now=id(r.v[k.group]),before=id(prior.v[k.group]);
  if(now===before)continue;
  const d=dims(r),p=dims(prior),n=Number(now),o=Number(before);
  const direction=/^[1-5]$/.test(now)&&/^[1-5]$/.test(before)?(n>o?'Chuyển nhóm xấu hơn':'Chuyển nhóm tốt hơn'):'Cần kiểm tra mã nhóm';
  results.push({r,prior,d,p,direction,now,before});
 }
 return results;
}
function debtGroupChangePanel(){
 const changes=debtGroupChanges(),shown=changes.filter(x=>{
  const d=x.d;
  return ($('#dept').value==='ALL'||d.dept===$('#dept').value)&&($('#officer').value==='ALL'||d.officer===$('#officer').value)&&($('#currency').value==='ALL'||d.currency===$('#currency').value)&&($('#segment').value==='ALL'||d.segment===$('#segment').value)&&($('#product').value==='ALL'||d.product===$('#product').value);
 });
 const worse=shown.filter(x=>x.direction==='Chuyển nhóm xấu hơn').length,better=shown.filter(x=>x.direction==='Chuyển nhóm tốt hơn').length;
 const headers=['Mã khách hàng','Tên khách hàng','Số tài khoản vay','Mã chi nhánh','Phòng ban hiện tại','Mã phòng hiện tại','Mã cán bộ hiện tại','Tên cán bộ','Phòng kỳ gốc','Cán bộ kỳ gốc','Phân khúc','Sản phẩm','Loại tiền','Nhóm nợ kỳ gốc','Nhóm nợ hiện tại','Chiều biến động','Dư nợ kỳ gốc (quy đổi)','Dư nợ hiện tại (quy đổi)','Chênh lệch dư nợ','Ngày kỳ gốc','Ngày hiện tại'];
 const rows=shown.map(x=>{const k=K.LN,v=x.r.v,pv=x.prior.v,old=val(x.prior,'balance'),now=val(x.r,'balance');return [id(v[k.client]),id(v[k.clientname]),id(v[k.account]),id(v[k.branch]),x.d.deptname,x.d.dept,id(v[k.staff]).toUpperCase(),id(v[k.staffname]),x.p.deptname,x.p.officer,id(v[k.segment]),id(v[k.product]),id(v[k.currency]),x.before,x.now,x.direction,old,now,old===null||now===null?'':now-old,x.prior.date,x.r.date]});
 return `<div class="grid" style="margin:14px 0">${stat('Khách hàng/khoản vay đổi nhóm',fmt(shown.length))}${stat('Chuyển nhóm xấu hơn',fmt(worse))}${stat('Chuyển nhóm tốt hơn',fmt(better))}${stat('Cần kiểm tra mã nhóm',fmt(shown.length-worse-better))}</div>`+
 panel('DANH SÁCH CHI TIẾT KHOẢN VAY THAY ĐỔI NHÓM NỢ — '+shown.length+' khoản vay',`<p class="tip">Đối chiếu theo mã chi nhánh và số tài khoản vay giữa hai kỳ. Chỉ hiển thị khoản vay có mặt ở cả hai kỳ và nhóm nợ khác nhau. Bộ lọc Phòng ban, Cán bộ và các bộ lọc phía trên áp dụng theo kỳ hiện tại. Có thể tìm kiếm, sắp xếp từng cột và xuất CSV đầy đủ danh sách.</p>${table(headers,rows,300)}`);
}
function staffPage(){let r=filterRows(active);return officerCharts()+`<div class="two">${panel('Tổng hợp phòng ban',table(['Phòng ban','Số dòng','Số dư'],groupSum(r,x=>dims(x).deptname||dims(x).dept||'Không rõ').map(x=>[x.name,String(x.count),x.balance])))}${panel('Tổng hợp cán bộ',table(['Mã cán bộ','Số dòng','Số dư'],groupSum(r,x=>dims(x).officer||'Không rõ').map(x=>[x.name,String(x.count),x.balance])))}</div><p class="tip">Các bảng tổng hợp gồm hai nghiệp vụ khác nhau; không coi tổng tiền gửi + dư nợ là một KPI tài chính. Xem riêng từng nghiệp vụ trong Dashboard tương ứng.</p>`}
function customerName(x){return String(x.v[K[x.kind].clientname]??'').trim()}
function customerMap(rows){let m=new Map();for(let x of rows){let k=id(x.v[K[x.kind].client]);if(!k)continue;if(!m.has(k))m.set(k,{client:k,name:'',nameSource:'',dp:0,ln:0,dpn:0,lnn:0});let z=m.get(k),n=val(x,'balance')||0,name=customerName(x);if(name&&(x.kind==='LN'||!z.name)){z.name=name;z.nameSource=x.kind}if(x.kind==='DP'){z.dp+=n;z.dpn++}else{z.ln+=n;z.lnn++}}return [...m.values()]}
function customerTableRows(rows,q=''){return customerMap(rows).filter(x=>x.client.toLowerCase().includes(q.toLowerCase())||x.name.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.dp+b.ln-a.dp-a.ln).map(x=>[x.client,x.name||'Chưa có tên',String(x.dpn),x.dp,String(x.lnn),x.ln])}
function customerPage(){let q=$('#customerSearch')?.value||'';return `<div class="panel"><h3>Khách hàng 360° — CIF và tên khách hàng</h3><input id="customerSearch" placeholder="Tìm theo CIF hoặc tên khách hàng (chỉ tìm nội bộ)" value="${esc(q)}" oninput="renderCustomerRows()"><div id="customerRows" style="margin-top:12px">${table(['Số CIF','Tên khách hàng','Số TK tiền gửi','Tiền gửi','Số TK vay','Dư nợ'],customerTableRows(filterRows(active),q),200)}</div><p class="tip">Tên ưu tiên từ AccountLN (Tên khách hàng); nếu không có, sử dụng AccountDP (Tên tài khoản). Nếu không có tên thì hiển thị Chưa có tên. Không gửi thông tin khách hàng ra ngoài.</p></div>`}

function financePage(){let dp=filterRows(active,'DP'),ln=filterRows(active,'LN');return `<div class="two">${panel('Tiền gửi — FTP / NII',`<div class="grid" style="grid-template-columns:1fr 1fr">${stat('FTP thu nhập ngày',money(sum(dp,'ftpdaily').total))}${stat('FTP cộng dồn tại ngày',money(sum(dp,'ftpcum').total))}${stat('NII ngày',money(sum(dp,'daily').total))}${stat('NII cộng dồn tại ngày',money(sum(dp,'cumulative').total))}</div>`)}${panel('Tiền vay — Thu nhập ròng',`<div class="grid" style="grid-template-columns:1fr 1fr">${stat('Thu nhập ròng ngày',money(sum(ln,'daily').total))}${stat('Cộng dồn tại ngày',money(sum(ln,'cumulative').total))}${stat('FTP bình quân',weighted(ln,'ftp').value===null?'N/A':fmt(weighted(ln,'ftp').value,4))}${stat('NIM bình quân',weighted(ln,'nim').value===null?'N/A':fmt(weighted(ln,'nim').value,4))}</div>`)}</div><p class="tip">Không cộng giá trị cộng dồn giữa các ngày. Công thức FTP/NIM/NII phụ thuộc xác nhận đơn vị và quy ước dữ liệu tại máy; giá trị bình quân được tính gia quyền theo số dư quy đổi dương.</p>`}
function accountDetail(r){let k=K[r.kind],d=dims(r);return [id(r.v[k.account]),id(r.v[k.client]),customerName(r)||'Chưa có tên',d.deptname||d.dept,d.officer,r.kind==='LN'?id(r.v[k.staffname]):'',d.currency,d.product,val(r,'balance'),excelDate(r.v[k.maturity])||'',r.kind==='LN'?id(r.v[k.group]):'',val(r,'nim')];}

function newAccountsPage(){if(!base.length)return panel('Chưa có kỳ đối chiếu','Chọn kỳ gốc có dữ liệu để xác định tài khoản mới. Không suy luận tài khoản mới khi thiếu kỳ gốc.');let current=filterRows(active),previous=filterRows(base);function newly(kind){let old=new Set(previous.filter(x=>x.kind===kind).map(accountKey));return current.filter(x=>x.kind===kind&&!old.has(accountKey(x)))}let ln=newly('LN'),dp=newly('DP');return `<div class="grid">${stat('Tài khoản vay mới',fmt(ln.length))}${stat('Tài khoản gửi mới',fmt(dp.length))}${stat('Kỳ gốc đối chiếu',$('#baseInfo').textContent)}</div>${panel('DANH SÁCH TÀI KHOẢN TIỀN VAY MỚI',table(ACCOUNT_HEADERS,ln.map(accountDetail),1000))}${panel('DANH SÁCH TÀI KHOẢN TIỀN GỬI MỚI',table(ACCOUNT_HEADERS,dp.map(accountDetail),1000))}<p class="tip">Tài khoản mới = xuất hiện trong kỳ hiện tại nhưng không có trong kỳ gốc cùng loại nghiệp vụ và chi nhánh. Bộ lọc toàn cục áp dụng cho cả hai kỳ; chuyển phòng/cán bộ có thể làm tài khoản xuất hiện là mới trong phạm vi lọc, không nhất thiết là tài khoản mở mới trên toàn Chi nhánh.</p>`}

function v25Bars(items){if(!items.length)return '<div class="v25-empty">Chưa có dữ liệu phù hợp</div>';let max=Math.max(1,...items.map(x=>Math.abs(x.balance)));return v25SVG(items.slice(0,7).map((x,i)=>{let y=12+i*32,w=Math.abs(x.balance)/max*330;return `<text x="2" y="${y+14}" font-size="12" fill="currentColor">${esc(String(x.name).slice(0,15))}</text><rect x="155" y="${y}" width="${w}" height="20" rx="4" fill="${v25Colors[i%8]}"><title>${esc(x.name)}: ${money(x.balance)}</title></rect><text x="${Math.min(492,162+w)}" y="${y+14}" font-size="11" fill="currentColor">${esc(fmt(x.balance,0))}</text>`}).join(''))}

function v25Trend(){let days=[...new Set(manifest.map(x=>x.day||x.date||x.period).filter(Boolean))].sort().slice(-10);if(!days.length){days=[...new Set(active.map(x=>x.day).filter(Boolean))].sort().slice(-10)}let data=days.map(day=>({day,dp:0,ln:0}));let map=new Map(data.map(x=>[x.day,x]));for(let [day,rs] of cache){if(!map.has(day))continue;for(let r of rs){let x=map.get(day),v=val(r,'balance');if(v!==null)x[r.kind==='DP'?'dp':'ln']+=v}}let valid=data.filter(x=>x.dp||x.ln);if(valid.length<2)return '<div class="v25-empty">Cần ít nhất 2 kỳ đã tải để vẽ xu hướng. Không nội suy dữ liệu thiếu.</div>';let max=Math.max(1,...valid.flatMap(x=>[x.dp,x.ln]));return v25SVG(['dp','ln'].map((k,j)=>`<polyline fill="none" stroke="${v25Colors[j]}" stroke-width="3" points="${valid.map((x,i)=>`${30+i*490/(valid.length-1)},${205-x[k]/max*175}`).join(' ')}"/>`).join('')+valid.map((x,i)=>`<text x="${30+i*490/(valid.length-1)}" y="231" text-anchor="middle" font-size="10" fill="currentColor">${esc(String(x.day).slice(5))}</text>`).join('')+`<text x="32" y="16" fill="${v25Colors[0]}" font-size="12">■ Tiền gửi</text><text x="135" y="16" fill="${v25Colors[1]}" font-size="12">■ Tiền vay</text>`)}
function v25Migration(){let old=new Map(filterRows(base,'LN').map(r=>[accountKey(r),r]));let counts={better:0,worse:0,same:0,unknown:0},flows=new Map();for(let r of v25Data('LN')){let p=old.get(accountKey(r));if(!p)continue;let a=num(p.v[K.LN.group]),b=num(r.v[K.LN.group]);if(a===null||b===null){counts.unknown++;continue}counts[b>a?'worse':b<a?'better':'same']++;let key=a+' → '+b;flows.set(key,(flows.get(key)||0)+1)}return {counts,flows}}
function v25Waterfall(){if(!base.length)return '<div class="v25-empty">Chọn kỳ gốc để xem phân rã biến động.</div>';let old=new Map(filterRows(base,'LN').map(r=>[accountKey(r),r])),current=new Map(v25Data('LN').map(r=>[accountKey(r),r]));let start=0,added=0,up=0,down=0,gone=0;for(let r of old.values())start+=val(r,'balance')||0;for(let [key,r] of current){let v=val(r,'balance')||0,p=old.get(key);if(!p)added+=v;else{let d=v-(val(p,'balance')||0);if(d>=0)up+=d;else down+=d}}for(let [key,r] of old)if(!current.has(key))gone-=val(r,'balance')||0;let end=start+added+up+down+gone,arr=[['Kỳ gốc',start],['Mới',added],['Tăng',up],['Giảm',down],['Vắng',gone],['Kỳ này',end]],max=Math.max(1,...arr.map(x=>Math.abs(x[1])),Math.abs(end));let running=0;return v25SVG(arr.map(([label,v],i)=>{let baseY=208,scale=170/max,x=18+i*90,w=60;let y,h;if(i===0||i===5){y=baseY-Math.max(0,v)*scale;h=Math.abs(v)*scale}else{let before=running||start,after=before+v;y=baseY-Math.max(before,after)*scale;h=Math.abs(v)*scale}if(i===0)running=start;else if(i<5)running+=v;return `<rect x="${x}" y="${Math.max(16,y)}" width="${w}" height="${Math.max(2,h)}" rx="3" fill="${i===0||i===5?v25Colors[0]:v>=0?v25Colors[4]:v25Colors[2]}"><title>${esc(label)}: ${money(v)}</title></rect><text x="${x+30}" y="229" text-anchor="middle" font-size="11" fill="currentColor">${esc(label)}</text>`}).join(''))}

function v25Sankey(){let {flows}=v25Migration(),entries=[...flows].sort((a,b)=>b[1]-a[1]).slice(0,12);if(!entries.length)return '<div class="v25-empty">Cần hai kỳ có khoản vay trùng khóa và nhóm nợ hợp lệ.</div>';return `<div class="v25-sankey"><div><strong>Kỳ trước → kỳ này</strong>${entries.map(([k,v])=>`<div class="flow" title="${esc(k)}">${esc(k)}: <b>${fmt(v)} khoản</b></div>`).join('')}</div><div><strong>Tỷ trọng luồng</strong>${entries.map(([k,v])=>`<div class="flow" style="background:linear-gradient(90deg,#7ed3f7 ${100*v/Math.max(...entries.map(x=>x[1]))}%,transparent 0%)" title="${esc(k)}">${fmt(v)} khoản</div>`).join('')}</div></div><p class="v25-note">Luồng chuyển nhóm theo số khoản vay, không phải giá trị dư nợ.</p>`}

function v25Insights(){let ln=v25Data('LN'),dep=groupSum(ln,r=>dims(r).deptname||dims(r).dept||'Khác'),grp=groupSum(ln,r=>'Nhóm '+(id(r.v[K.LN.group])||'Không rõ')),m=v25Migration();return `<div class="v25-toolbar"><h2>Phân tích chuyên sâu · 8 biểu đồ</h2><span class="muted">Dữ liệu theo bộ lọc hiện tại · Không sử dụng CDN/API</span></div><div class="two">${panel('01 · Xu hướng tiền gửi / dư nợ',`<div class="v25-chart">${v25Trend()}</div><p class="v25-note">Chỉ vẽ các kỳ đã được tải vào bộ nhớ phiên làm việc.</p>`)}${panel('02 · Xếp hạng dư nợ phòng ban',`<div class="v25-chart">${v25Bars(dep)}</div>`)}${panel('03 · Cơ cấu dư nợ theo nhóm',`<div class="v25-chart">${v25Donut(grp)}</div>`)}${panel('04 · Dịch chuyển chất lượng nợ',`<div class="v25-chart">${v25Bars([{name:'Chuyển xấu',balance:m.counts.worse},{name:'Cải thiện',balance:m.counts.better},{name:'Không đổi',balance:m.counts.same},{name:'Thiếu nhóm',balance:m.counts.unknown}])}</div>`)}${panel('05 · Waterfall biến động dư nợ',`<div class="v25-chart">${v25Waterfall()}</div>`)}${panel('06 · Heatmap phòng ban × nhóm nợ',v25Heat())}${panel('07 · Luồng chuyển nhóm nợ',v25Sankey())}${panel('08 · Treemap cơ cấu dư nợ',v25Tree())}</div><p class="tip">Biểu đồ dựa trên dữ liệu nhập và bộ lọc; kỳ gốc được dùng để đối chiếu. Khoản vay không xuất hiện kỳ sau không mặc nhiên được coi là tất toán. Nhóm nợ thiếu hoặc không hợp lệ được tách riêng.</p>`}

 let relations={};for(let r of els(rels,'Relationship'))relations[r.getAttribute('Id')]=r.getAttribute('Target');let out={};
 for(let sh of els(book,'sheet')){let name=sh.getAttribute('name'),kind=sheetKind(name);if(!kind)continue;
 if(out[kind])throw Error('Có nhiều sheet cùng loại '+kind+'; cần xác định sheet đúng');
 let rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'),target=relations[rid];if(!target)throw Error('Không tìm thấy liên kết sheet '+name);
 let path=target.startsWith('/')?target.slice(1):'xl/'+target.replace(/^\.\//,'');path=path.replace(/\/\.\//g,'/');if(path.startsWith('xl/xl/'))path=path.slice(3);

async function runSelfTests(){let tests=await runEnvironmentTests(),add=(name,fn)=>{try{let ok=fn();tests.push({name,pass:!!ok,detail:ok?'Khớp kỳ vọng':'Sai kết quả'})}catch(e){tests.push({name,pass:false,detail:e.message})}};add('Đọc số thập phân kiểu Việt Nam',()=>num('1.234,56')===1234.56);add('Chuyển ngày Excel',()=>excelDate(45292)==='2024-01-01');add('Ngày LN Mỹ M/D/YYYY',()=>excelDate('1/26/2026')==='2026-01-26');add('Ngày LN Mỹ MM/DD/YYYY',()=>excelDate('10/26/2026')==='2026-10-26');add('Ngày LN Mỹ có giờ',()=>excelDate('10/26/2026 12:00:00 AM')==='2026-10-26');add('Ngày Mỹ không hợp lệ',()=>excelDate('13/26/2026')==='');add('Ngày không hợp lệ không được chấp nhận',()=>excelDate('không phải ngày')==='');add('CIF giữ số 0 đầu',()=>id('001234')==='001234');add('Tổng số dư không biến null thành giá trị hợp lệ',()=>num('')===null);add('Header dòng 1, bỏ mẫu dòng 2, đọc từ dòng 3',()=>{const h=H.DP;const sample=h.map((_,i)=>'MAU'+i);const real=h.map((_,i)=>'THAT'+i);const out=validateSheet([h,sample,real,[]],'DP');return out.length===1&&out[0][h[0]]==='THAT0'});add('Kiểm tra sheet thiếu cột',()=>{try{validateSheet([['Tài khoản']],'DP');return false}catch{return true}});add('Chặn ngày báo cáo không thống nhất',()=>{let a=Object.fromEntries(H.LN.map(x=>[x,'']));a['Ngày báo cáo']='2026-10-20';a[K.LN.account]='1';a[K.LN.balance]=1;a[K.LN.group]='1';let b={...a,'Ngày báo cáo':'2026-10-21','Số tài khoản':'2'};try{quality([], [a,b]);return false}catch{return true}});add('Phát hiện khóa tài khoản trùng',()=>{let a=Object.fromEntries(H.LN.map(x=>[x,'']));a['Ngày báo cáo']='2026-10-20';a[K.LN.account]='1';a[K.LN.balance]=1;a[K.LN.group]='1';try{quality([], [a,{...a}]);return false}catch{return true}});add('Công thức phân rã biến động',()=>12+18-10-5===15);showTests(tests)}

async function rescanFolder(){
 if(busy)return toast('Đang nhập dữ liệu, vui lòng chờ',true);
 if(!folderHandle){$('#folderPicker').click();return}
 let files=[];
 async function walk(dir){for await(const [name,handle] of dir.entries()){
   if(handle.kind==='directory')await walk(handle);
   else if(/\.xlsx?$/i.test(name)&&!/^~\$/.test(name))files.push(await handle.getFile());
 }}
 try{await walk(folderHandle);await processFolderFiles(files)}catch(e){toast('Lỗi quét thư mục: '+e.message,true)}
}
async function processFolderFiles(files){
 files=files.filter(f=>/\.xlsx?$/i.test(f.name)&&!/^~\$/.test(f.name));
 if(!files.length)return toast('Không tìm thấy file Excel XLS/XLSX trong thư mục',true);
 // Already-imported filenames are only a prefilter; the importer remains authoritative on report date.
 const names=new Set(manifest.map(m=>m.filename));
 const fresh=files.filter(f=>!names.has(f.name));
 const skipped=files.length-fresh.length;
 if(!fresh.length)return toast('Đã quét '+files.length+' file; không có tên file mới để nhập. Dùng nhập thủ công nếu file cũ đã đổi nội dung.');
 if(!confirm('Tìm thấy '+files.length+' file Excel XLS/XLSX; '+fresh.length+' file chưa có tên trong lịch sử và '+skipped+' file bỏ qua theo tên. Nhập các file mới?'))return;
 await importFiles(fresh);
}
function xmlEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}
function xlsxCol(n){let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}
function sheetXML(rows){let lines=['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>','<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetData>'];
 for(let i=0;i<rows.length;i++){
  lines.push('<row r="'+(i+1)+'">');let row=rows[i];
  for(let j=0;j<row.length;j++){let v=row[j];if(v===null||v===undefined||v==='')continue;let ref=xlsxCol(j)+(i+1);
   if(typeof v==='number'&&Number.isFinite(v))lines.push('<c r="'+ref+'"><v>'+v+'</v></c>');
   else lines.push('<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(v)+'</t></is></c>');
  }lines.push('</row>');
 }lines.push('</sheetData></worksheet>');return lines.join('')}
